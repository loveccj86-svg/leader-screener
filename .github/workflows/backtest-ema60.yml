name: EMA60 -25% 반등 백테스트

on:
  push:
    branches: [backtest-ema60]
    paths: ["backtest/**", ".github/workflows/backtest-ema60.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy requests
      - run: mkdir -p backtest/results && python backtest/ema60_rebound.py 2>&1 | tee backtest/results/log.txt
      - run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add backtest/results
          git commit -m "EMA60 백테스트 결과 [skip ci]" || true
          git push
