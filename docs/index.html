<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주도주 스크리너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f1;--panel:#ffffff;--ink:#1d1d1b;--ink2:#5c5b56;--ink3:#8d8b84;--line:#e3e1da;--line2:#efede7;
  --accent:#1f5fbf;--accent-soft:#e7eefa;--good:#1f7a4d;--good-soft:#e3f2ea;--warn:#a86500;--warn-soft:#fbf0dc;
  --bad:#b3261e;--bad-soft:#f9e3e1;--chip:#f0eee8;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151513;--panel:#1d1d1a;--ink:#ecebe6;--ink2:#b3b1aa;--ink3:#85837c;--line:#33322e;--line2:#2a2926;
  --accent:#7aa7ef;--accent-soft:#1f2a3d;--good:#5cc28d;--good-soft:#173226;--warn:#e0a54a;--warn-soft:#352812;
  --bad:#f08a80;--bad-soft:#3a1d1a;--chip:#2a2926;--shadow:none;}}
:root[data-theme="dark"]{
  --bg:#151513;--panel:#1d1d1a;--ink:#ecebe6;--ink2:#b3b1aa;--ink3:#85837c;--line:#33322e;--line2:#2a2926;
  --accent:#7aa7ef;--accent-soft:#1f2a3d;--good:#5cc28d;--good-soft:#173226;--warn:#e0a54a;--warn-soft:#352812;
  --bad:#f08a80;--bad-soft:#3a1d1a;--chip:#2a2926;--shadow:none;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,sans-serif;font-size:14px;line-height:1.5}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1360px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.sub{color:var(--ink2);font-size:13px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--ink3)}
.markets{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:16px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.mcard h3{margin:0 0 8px;font-size:13px;color:var(--ink2);font-weight:600;display:flex;justify-content:space-between}
.mrow{display:grid;grid-template-columns:72px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line2)}
.mrow:first-of-type{border-top:0}
.mname{font-weight:600}
.mmeta{color:var(--ink2);font-size:12px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.up{background:var(--good-soft);color:var(--good)}.pill.down{background:var(--bad-soft);color:var(--bad)}.pill.pressure{background:var(--warn-soft);color:var(--warn)}
.base{font-size:12px;color:var(--ink2);margin-top:8px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-weight:500}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;font:inherit;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .c{font-size:12px;color:var(--ink3);margin-left:4px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.filters input[type=search],.filters select{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 10px;font:inherit}
.filters label{display:flex;gap:6px;align-items:center;color:var(--ink2);font-size:13px}
.summary{color:var(--ink2);font-size:13px;margin-left:auto}
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:auto;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:1100px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line2);white-space:nowrap}
th{font-size:12px;color:var(--ink2);font-weight:600;position:sticky;top:0;background:var(--panel);cursor:pointer;user-select:none}
th.l,td.l{text-align:left}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--line2)}
.nm{font-weight:600;max-width:220px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:bottom}
.sym{color:var(--ink3);font-size:12px;margin-left:6px}
.new{font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 5px;margin-left:6px}
.score{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.sbar{width:52px;height:6px;border-radius:3px;background:var(--line2);overflow:hidden}
.sbar i{display:block;height:100%;background:var(--accent)}
.grade{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.g-주도주후보{background:var(--good-soft);color:var(--good)}.g-관찰{background:var(--accent-soft);color:var(--accent)}
.g-약함{background:var(--chip);color:var(--ink2)}.g-탈락{background:var(--bad-soft);color:var(--bad)}
.dots{display:inline-flex;gap:3px}
.dot{width:18px;height:18px;border-radius:4px;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.dot.y{background:var(--good-soft);color:var(--good)}.dot.n{background:var(--chip);color:var(--ink3)}.dot.x{background:transparent;color:var(--ink3);border:1px dashed var(--line)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;margin-right:4px}
.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.good{background:var(--good-soft);color:var(--good)}
.spark{display:block}
.empty{padding:40px;text-align:center;color:var(--ink2)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .15s}
.scrim.on{opacity:1;pointer-events:auto}
aside{position:fixed;top:0;right:0;height:100%;width:min(640px,100%);background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .2s;overflow-y:auto;z-index:10}
aside.on{transform:none}
.dh{position:sticky;top:0;background:var(--panel);padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dh h2{margin:0;font-size:18px}
.db{padding:16px 20px 40px}
.sec{margin-bottom:22px}
.sec h4{margin:0 0 8px;font-size:12px;color:var(--ink2);text-transform:none;letter-spacing:.02em}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--bg);border-radius:8px;padding:8px 10px}
.kv b{display:block;font-size:11px;color:var(--ink2);font-weight:500}
.ai{background:var(--accent-soft);border-radius:10px;padding:12px 14px}
.ai p{margin:0 0 6px}.ai p:last-child{margin:0}
.ai .lbl{font-size:11px;font-weight:600;color:var(--accent);margin-right:6px}
.ai .cs{display:grid;grid-template-columns:auto 1fr;gap:5px 9px;margin:8px 0 10px;align-items:baseline}
.ai .cs b{font-family:var(--mono,monospace);font-size:11px;min-width:34px;text-align:center;padding:2px 5px;border-radius:4px;background:#e9ecef;color:#555}
.ai .cs b.ok{background:#dcf2e5;color:#1d7a46}.ai .cs b.ng{background:#fbe3e1;color:#b3261e}
.ai .cs span{font-size:13px;line-height:1.5}
.checks{display:grid;gap:4px}
.ck{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line2);font-size:13px}
.ck .grp{font-size:11px;color:var(--ink3)}
.fin{width:100%;min-width:0;font-size:13px}
.fin th,.fin td{padding:6px 8px}
.note{font-size:12px;color:var(--ink3)}
.summary-en{color:var(--ink2);font-size:13px}
@media (max-width:720px){
  h1{font-size:19px}
  .kv{grid-template-columns:repeat(2,1fr)}
  .mrow{grid-template-columns:60px 1fr auto}
}
.ftd{display:inline-block;margin-top:3px;font-size:11.5px;color:var(--muted,#888)}
.ftd.ftd{color:#1a9c5b;font-weight:600}.ftd.falling{color:#d04545}.ftd.rally{color:#c08a12}
.tvlink{color:inherit;text-decoration:none;border-bottom:1px dotted currentColor}
.tvlink:hover{color:var(--accent,#2962ff)}.tvi{font-size:10px;margin-left:3px;opacity:.6}
.dbtns{display:flex;gap:6px;align-items:flex-start}.tvbtn{text-decoration:none;white-space:nowrap}

/* 생존 보드 */
.views{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:10px;background:var(--panel)}
.views button{border:0;background:none;padding:7px 14px;font:inherit;color:var(--ink2);cursor:pointer}
.views button[aria-pressed="true"]{background:var(--ink);color:var(--panel);font-weight:600}
.svcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:10px}
.svcards div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.svcards b{display:block;font-size:12px;color:var(--ink2);font-weight:500}
.svcards span{font-size:20px;font-weight:600}
.svchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.svchips button{border:1px solid var(--line);background:var(--panel);color:var(--ink2);border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.svchips button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.svchips input{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px}
.rb{display:inline-block;min-width:38px;text-align:center;font-size:12px;font-weight:600;padding:1px 6px;border-radius:5px;margin-left:6px}
.rb.g{background:var(--good-soft);color:var(--good)}.rb.y{background:var(--warn-soft);color:var(--warn)}.rb.r{background:var(--bad-soft);color:var(--bad)}.rb.na{background:var(--chip);color:var(--ink3)}
.sq{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:2px;vertical-align:-1px}
.sq.g{background:var(--good)}.sq.n{background:var(--line)}.sq.r{background:var(--bad)}.sq.x{border:1px dashed var(--line)}
.sq.L{outline:2px solid var(--ink3);outline-offset:1px}
.st{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.st.g{background:var(--good-soft);color:var(--good)}.st.y{background:var(--warn-soft);color:var(--warn)}.st.r{background:var(--bad-soft);color:var(--bad)}.st.n{background:var(--chip);color:var(--ink2)}
.svlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>주도주 스크리너</h1>
      <div class="sub" id="gen">불러오는 중…</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn" id="rulesBtn">판정 기준</button>
      <button class="btn" id="themeBtn" aria-label="테마 전환">테마</button>
    </div>
  </header>
  <div id="banner"></div>
  <section class="markets" id="markets"></section>
  <nav class="views" id="views"><button data-v="list" aria-pressed="true">주도주 후보</button><button data-v="sv" aria-pressed="false">생존 보드</button></nav>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="filters" id="filtersBar">
    <input type="search" id="q" placeholder="종목명·코드 검색">
    <select id="grade">
      <option value="">전체 판정</option><option>주도주 후보</option><option>관찰</option><option>약함</option><option>탈락</option>
    </select>
    <label><input type="checkbox" id="hideOut" checked> 탈락 숨기기</label>
    <label><input type="checkbox" id="onlyNew"> 신규 진입만</label>
    <span class="summary" id="sum"></span>
  </div>
  <div id="svWrap" hidden></div>
  <div class="tablewrap" id="listWrap"><table>
    <thead><tr id="thead"></tr></thead>
    <tbody id="tbody"></tbody>
  </table></div>
  <p class="note" style="margin-top:10px">시세·재무: Yahoo Finance(yfinance), 선택적으로 OpenDART·SEC. 점수는 규칙 대비 위치이며 매수 권유가 아닙니다. 행을 누르면 회사 소개와 5개년 재무가 열립니다.</p>
</div>

<div class="scrim" id="scrim"></div>
<aside id="drawer" aria-hidden="true">
  <div class="dh"><div><h2 id="dTitle"></h2><div class="sub" id="dSub"></div></div><div class="dbtns"><a class="btn tvbtn" id="dTv" target="_blank" rel="noopener">TradingView ↗</a><button class="btn" id="dClose">닫기</button></div></div>
  <div class="db" id="dBody"></div>
</aside>

<script>
function aiVerdict(ai){
  if (!ai.C) return `<p><span class="lbl">판정</span>${esc(ai.verdict||'')}</p>`;
  const row = (k, lb) => { const t = ai[k] || ''; if (!t) return '';
    const cls = /^통과/.test(t) ? 'ok' : /^미달/.test(t) ? 'ng' : '';
    return `<b class="${cls}">${lb}</b><span>${esc(t)}</span>`; };
  return (ai.market ? `<p><span class="lbl">시장(M)</span>${esc(ai.market)}</p>` : '') +
    `<div class="cs">${row('C','C')}${row('A','A')}${row('N','N')}${row('S','S')}${row('L','L')}${row('I','I')}${row('DB','DB')}${row('HANA','하나')}</div>` +
    (ai.stage ? `<p><span class="lbl">단계</span>${esc(ai.stage)}</p>` : '');
}

const S = {data:null, details:null, idx:null, sort:{k:'rank',dir:1}};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = (v, d=1, sign=true) => v==null ? '–' : `${sign && v>0?'+':''}${(v*100).toFixed(d)}%`;
const cls = v => v==null ? '' : v>0 ? 'pos' : v<0 ? 'neg' : '';
function money(v, cur){
  if(v==null) return '–';
  const a = Math.abs(v), s = v<0?'-':'';
  if(cur==='KRW'){ if(a>=1e12) return s+(a/1e12).toFixed(2)+'조'; if(a>=1e8) return s+Math.round(a/1e8).toLocaleString()+'억'; return s+Math.round(a).toLocaleString(); }
  if(a>=1e9) return s+'$'+(a/1e9).toFixed(1)+'B'; if(a>=1e6) return s+'$'+(a/1e6).toFixed(0)+'M'; return s+'$'+a.toFixed(0);
}
function price(v, cur){ if(v==null) return '–'; return cur==='KRW' || v>1000 ? Math.round(v).toLocaleString() : v.toFixed(2); }

// theme
(function(){ let t=null; try{t=localStorage.getItem('theme')}catch(e){} if(t) document.documentElement.dataset.theme=t; })();
$('#themeBtn').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const nx = cur==='dark'?'light':'dark'; document.documentElement.dataset.theme = nx; try{localStorage.setItem('theme',nx)}catch(e){}
};

async function load(){
  try{
    const r = await fetch('data/latest.json', {cache:'no-store'}); S.data = await r.json();
  }catch(e){ $('#gen').textContent='데이터를 불러오지 못했습니다. 워크플로가 한 번 이상 실행됐는지 확인하세요.'; return; }
  const g = new Date(S.data.generated);
  $('#gen').textContent = `마지막 갱신 ${g.toLocaleString('ko-KR',{dateStyle:'medium',timeStyle:'short'})}`;
  renderMarkets();
  const order = ['KOSPI200','KOSDAQ150','NASDAQ100','SP500'].filter(k=>S.data.indexes[k]);
  let saved=null; try{saved=localStorage.getItem('idx')}catch(e){}
  S.idx = order.includes(saved) ? saved : order[0];
  $('#tabs').innerHTML = order.map(k=>{
    const b=S.data.indexes[k]; const n=b.stocks.filter(s=>s.grade==='주도주 후보').length;
    return `<button class="tab" role="tab" data-k="${k}" aria-selected="${k===S.idx}">${esc(b.label)}<span class="c">후보 ${n}</span></button>`;}).join('');
  $('#tabs').onclick = e => { const b=e.target.closest('.tab'); if(!b) return; S.idx=b.dataset.k; try{localStorage.setItem('idx',S.idx)}catch(e){}
    document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', t.dataset.k===S.idx)); SV.view==='sv'?renderSurvival():render(); };
  let sv0=null; try{sv0=localStorage.getItem('view')}catch(e){}
  setView(sv0==='sv'?'sv':'list');
}

function renderMarkets(){
  const ms = S.data.markets, names={KR:'한국',US:'미국'};
  const down = Object.values(ms).some(m=>m.m_down);
  $('#banner').innerHTML = down ? `<div class="banner">시장(M) 하락 추세 지수가 있습니다. CAN SLIM 기준으로 지금 목록은 신규 매수가 아니라 관찰용입니다.</div>` : '';
  $('#markets').innerHTML = Object.entries(ms).map(([k,m])=>`
    <div class="mcard"><h3><span>${names[k]||k} 시장 (M)</span><span class="mono">${esc(m.asof||'')}</span></h3>
    ${m.M.map(x=>`<div class="mrow"><span class="mname">${esc(x.name)}</span>
      <span class="mmeta mono">${price(x.close)} <span class="${cls(x.chg1d)}">${pct(x.chg1d)}</span> · 고점대비 ${pct(x.from_hi52,1,false)}<br>
      6개월 큰상승 ${x.big_up_6m??'–'} / 큰하락 ${x.big_down_6m??'–'} · 분산일 ${x.dist_days_25??'–'}
      ${x.ftd?`<br><span class="ftd ${x.ftd.stage}">${x.ftd.stage==='ftd'?'● ':''}${esc(x.ftd.text)}</span>`:''}</span>
      <span class="pill ${x.status}">${esc(x.label)}</span></div>`).join('')}
    <div class="base">장세 시작일 <b class="mono">${esc(m.base_date)}</b> (${esc(m.base_mode)}, ${m.days_since_base}일 경과)</div></div>`).join('');
}

const COLS = [
  {k:'rank',t:'#'},
  {k:'name',t:'종목',l:1},
  {k:'score',t:'점수'},
  {k:'grade',t:'판정',l:1},
  {k:'canslim',t:'C A N S L I',l:1,nos:1},
  {k:'rs',t:'RS'},
  {k:'from_hi52',t:'52주 고점대비'},
  {k:'cycle_dd',t:'장세 고점대비'},
  {k:'mom_base',t:'장세 시작후'},
  {k:'rev',t:'매출 성장'},
  {k:'opm',t:'OPM 변화'},
  {k:'tags',t:'신호',l:1,nos:1},
  {k:'spark',t:'1년',nos:1},
];
const val = (s,k) => k==='rev' ? (s.q_rev_yoy ?? s.a_rev_growth) : k==='opm' ? (s.q_opm!=null ? s.q_opm-s.q_opm_prev : (s.opm_last!=null? s.opm_last-s.opm_prev:null)) : s[k];

function spark(w){
  if(!w||w.length<2) return '';
  const W=80,H=22, mn=Math.min(...w), mx=Math.max(...w), r=mx-mn||1;
  const pts=w.map((v,i)=>`${(i/(w.length-1)*W).toFixed(1)},${(H-2-(v-mn)/r*(H-4)).toFixed(1)}`).join(' ');
  const up = w[w.length-1]>=w[0];
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><polyline fill="none" stroke="${up?'var(--good)':'var(--bad)'}" stroke-width="1.4" points="${pts}"/></svg>`;
}
function dots(s){

function finChart(a, cur){
  const rows=a.filter(x=>x.revenue!=null); if(rows.length<2) return '';
  const W=560,H=170,P=34, mx=Math.max(...rows.map(x=>x.revenue),1), bw=(W-P*2)/rows.length*0.5;
  const opm=rows.map(x=>x.op!=null&&x.revenue?x.op/x.revenue:null), om=opm.filter(x=>x!=null);
  const oMin=Math.min(0,...om), oMax=Math.max(0.01,...om);
  const X=i=>P+(i+0.5)*(W-P*2)/rows.length, Y=v=>H-24-(v/mx)*(H-50), YO=v=>H-24-((v-oMin)/(oMax-oMin||1))*(H-50);
  const bars=rows.map((x,i)=>`<rect x="${X(i)-bw/2}" y="${Y(x.revenue)}" width="${bw}" height="${H-24-Y(x.revenue)}" rx="2" fill="var(--line)"><title>${x.year} 매출 ${money(x.revenue,cur)}</title></rect>
     <text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--ink2)">${x.year}</text>`).join('');
  const pts=opm.map((v,i)=>v==null?null:`${X(i)},${YO(v)}`).filter(Boolean).join(' ');
  const labels=opm.map((v,i)=>v==null?'':`<circle cx="${X(i)}" cy="${YO(v)}" r="3" fill="var(--accent)"/><text x="${X(i)}" y="${YO(v)-8}" text-anchor="middle" font-size="11" fill="var(--accent)">${(v*100).toFixed(1)}%</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="연간 매출과 영업이익률"><polyline fill="none" stroke="var(--accent)" stroke-width="1.6" points="${pts}"/>${bars}${labels}
    <text x="${P}" y="12" font-size="11" fill="var(--ink2)">막대: 매출 · 선: 영업이익률</text></svg>`;
}
function priceChart(s){
  const w=s.weekly, d=s.weekly_dates; if(!w||w.length<5) return '';
  const W=560,H=150,P=8, mn=Math.min(...w, s.cycle_high? s.cycle_high*0.7: Infinity), mx=Math.max(...w, s.cycle_high||0), r=mx-mn||1;
  const X=i=>P+i/(w.length-1)*(W-P*2), Y=v=>H-18-(v-mn)/r*(H-34);
  const pts=w.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');
  const ref = s.cycle_high ? `<line x1="${P}" x2="${W-P}" y1="${Y(s.cycle_high*0.7)}" y2="${Y(s.cycle_high*0.7)}" stroke="var(--bad)" stroke-dasharray="4 4" stroke-width="1"/>
    <text x="${P+2}" y="${Y(s.cycle_high*0.7)+14}" font-size="11" fill="var(--bad)">장세 고점 -30% · ${price(s.cycle_high*0.7)} 아래면 탈락</text>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="주간 종가 1년"><polyline fill="none" stroke="var(--ink)" stroke-width="1.5" points="${pts}"/>${ref}
    <text x="${P}" y="${H-4}" font-size="11" fill="var(--ink2)">${d[0]}</text><text x="${W-P}" y="${H-4}" text-anchor="end" font-size="11" fill="var(--ink2)">${d[d.length-1]}</text></svg>`;
}

  <div class="tablewrap"><table>
    <thead><tr>${th('name','종목',1)}${th('','판정',1)}${th('rs','RS')}${th('dd','현재 낙폭')}${th('r','비율')}${th('mdd','최대 낙폭')}${th('rm','비율')}
      <th class="l">충격일 ${sh.length?esc(sh[0].d.slice(5))+' → '+esc(sh[sh.length-1].d.slice(5)):'없음'}</th>${th('ok','방어')}<th>대충격</th><th class="l">상태</th></tr></thead>
    <tbody>${rows.length?rows.map(s=>{const v=s.sv, x=svStatus(s);
      if(v.bad) return `<tr data-s="${esc(s.symbol)}"><td class="l"><span class="nm">${esc(s.name||s.symbol)}</span></td><td colspan="9" class="l note">국장 비수정 주가(액면분할 추정)로 계산 제외</td><td class="l"><span class="st n">데이터 확인</span></td></tr>`;
      const sq=sh.map((z,i)=>{const m=v.m[off+i]||'-', sr=v.sr[off+i];
        return `<span class="sq ${m==='-'?'x':m} ${z.t==='L'?'L':''}" title="${z.d} ${esc(ib.name)} ${pct(z.r)} / 종목 ${sr==null?'–':pct(sr)}${z.t==='L'?' · 대충격':z.t==='M'?' · 중충격':''}"></span>`;}).join('');
      return `<tr data-s="${esc(s.symbol)}">
      <td class="l"><a class="nm tvlink" href="${tvUrl(s,b.market)}" target="_blank" rel="noopener">${esc(s.name||s.symbol)}<span class="tvi">↗</span></a><span class="sym mono">${esc(s.code)}</span></td>
      <td class="l"><span class="grade g-${s.grade.replace(' ','')}">${s.grade}</span></td>
      <td class="mono">${s.rs??'–'}</td>
      <td class="mono ${cls(v.dd)}">${pct(v.dd)}</td><td><span class="rb ${rcls(v.r)}">${rtxt(v.r)}</span></td>
      <td class="mono ${cls(v.mdd)}">${pct(v.mdd)}</td><td><span class="rb ${rcls(v.rm)}">${rtxt(v.rm)}</span></td>
      <td class="l">${sq}</td>
      <td class="mono">${v.n?v.ok+'/'+v.n:'–'}${v.streak>=2?` <span class="note">연속 ${v.streak}</span>`:''}</td>
      <td class="mono">${v.big_n?`<span class="${v.big_ok===v.big_n?'pos':v.big_ok===0?'neg':''}">${v.big_ok}/${v.big_n}</span>`:'<span class="note">미검증</span>'}</td>
      <td class="l">${x?`<span class="st ${x.k}">${esc(x.t)}</span>`:''}</td></tr>`;}).join(''):`<tr><td colspan="11" class="empty">조건에 맞는 종목이 없습니다.</td></tr>`}</tbody></table></div>
  <div class="svlegend"><span>비율 = 종목 52주 고점대비 낙폭 ÷ ${esc(ib.name)} 고점대비 낙폭</span>
    <span><span class="rb g">≤0.50</span> 지수 절반 이하 <span class="rb y">&lt;1</span> 덜 빠짐 <span class="rb r">≥1</span> 더 빠짐</span>
    <span><span class="sq g"></span> 지수보다 ${(ib.band*100).toFixed(1)}%p 이상 덜 빠짐 <span class="sq n"></span> 비슷 <span class="sq r"></span> 더 빠짐 <span class="sq g L"></span> 대충격</span>
    <span>충격일 기준 ${esc(ib.name)} 하루 소 ${t[0]} · 중 ${t[1]} · 대 ${t[2]} 이하</span>
    <span>생존 주도주 = RS 80↑ · 현재·최대 비율 0.5↓ · 최근 충격일 방어</span></div>`;
  box.querySelector('.svchips').onclick=e=>{const c=e.target.closest('button[data-c]'); if(!c) return; SV.chip=c.dataset.c; renderSurvival();};
  const qi=box.querySelector('#svq'); qi.oninput=()=>{SV.q=qi.value; const pos=qi.selectionStart; renderSurvival(); const n=$('#svq'); n.focus(); n.setSelectionRange(pos,pos);};
  box.querySelector('thead').onclick=e=>{const h=e.target.closest('th'); if(!h||!h.dataset.k) return; const k=h.dataset.k;
    SV.sort={k, dir: SV.sort.k===k ? -SV.sort.dir : (['rs','ok'].includes(k)?-1:k==='dd'||k==='mdd'?-1:1)}; renderSurvival();};
  box.querySelector('tbody').onclick=e=>{ if(e.target.closest('a')) return; const tr=e.target.closest('tr[data-s]'); if(tr) openDetail(tr.dataset.s); };
}
function setView(v){
  SV.view=v; try{localStorage.setItem('view',v)}catch(e){}
  document.querySelectorAll('#views button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===v));
  const sv=v==='sv'; $('#svWrap').hidden=!sv; $('#listWrap').hidden=sv; $('#filtersBar').style.display=sv?'none':'';
  if(sv) renderSurvival(); else render();
}
$('#views').onclick=e=>{const b=e.target.closest('button[data-v]'); if(b) setView(b.dataset.v);};
function ddChart(s, d, ib){
  if(!ib||!d.dd||!ib.series) return '';
  const a=d.dd, x=ib.series, n=x.length; const vals=[...a,...x].filter(v=>v!=null); if(vals.length<10) return '';
  const W=560,H=170,P=34, mn=Math.min(...vals,-1), mx=0;
  const X=i=>P+i/(n-1)*(W-P-8), Y=v=>14+(mx-v)/(mx-mn||1)*(H-40);
  const line=(arr,st,dash)=>{let p='',seg=[];arr.forEach((v,i)=>{if(v==null){if(seg.length) p+=`<polyline fill="none" stroke="${st}" stroke-width="${dash?1.4:2}" ${dash?'stroke-dasharray="4 3"':''} points="${seg.join(' ')}"/>`; seg=[];} else seg.push(`${X(i).toFixed(1)},${Y(v).toFixed(1)}`);});
    if(seg.length) p+=`<polyline fill="none" stroke="${st}" stroke-width="${dash?1.4:2}" ${dash?'stroke-dasharray="4 3"':''} points="${seg.join(' ')}"/>`; return p;};
  const di=Object.fromEntries(ib.dates.map((t,i)=>[t,i]));
  const bands=ib.shocks.filter(z=>di[z.d]!=null).map(z=>`<rect x="${(X(di[z.d])-3).toFixed(1)}" y="14" width="6" height="${H-40}" fill="var(--bad)" opacity="${z.t==='L'?0.22:0.1}"><title>${z.d} ${esc(ib.name)} ${pct(z.r)}</title></rect>`).join('');
  const grid=[0, Math.round(mn/2), Math.round(mn)].map(v=>`<line x1="${P}" x2="${W-8}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line2)"/><text x="${P-4}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--ink3)">${v}%</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="고점대비 낙폭 추이">${grid}${bands}${line(x,'var(--ink3)',1)}${line(a,'var(--good)',0)}
    <text x="${P}" y="${H-6}" font-size="11" fill="var(--ink2)">${esc(ib.dates[0])}</text><text x="${W-8}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--ink2)">${esc(ib.dates[n-1])}</text>
    <text x="${W-8}" y="11" text-anchor="end" font-size="11" fill="var(--ink2)">— 종목 · ┄ ${esc(ib.name)} · 빨간 띠 = 충격일</text></svg>`;
}
load();
</script>
</body>
